# 宝塔：将三个配套文件上传到 /www/wwwroot/data/token-nginx/。
# 用户站、管理站各自 server 块内 include 本文件；不要放在 location 内。
# 先移除原有 /api/ location，避免重复；证书、root、前端路由等保持原配置。
# 仅适用于 Cloudflare 直接连接本机 Nginx，再代理至本机 9091 的部署。
include /www/wwwroot/data/token-nginx/token-cloudflare-real-ip.conf;
include /www/wwwroot/data/token-nginx/token-api-same-origin.conf;
