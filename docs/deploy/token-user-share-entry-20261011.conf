# 2026-10-11：仅放在用户站 server 内，root 仍为 /www/wwwroot/data/user-dist。
# 替换旧 location /、location = /、location = /index.html、location @token_share_preview；
# 移除旧 token-user-entry.conf / token-share-preview.conf include，不能叠加两套入口。
# 此片段放在宝塔通用静态扩展名 location 之前；保留原 /api/、/token/、证书及真实IP配置。
# 如已有独立 /assets/ location，继续使用它，但缺失资源必须 try_files $uri =404。
# 不配置 error_page 404 /index.html；只有真正的 SPA 路由才使用下面的 try_files 回退。

# 精确首页不依赖 index 的内部重定向，根网址及其邀请码/语言/版本参数原样保留。
location = / {
    error_page 418 = @token_share_preview;
    if ($http_user_agent ~* "TelegramBot|facebookexternalhit|Facebot|Twitterbot|WhatsApp|LinkedInBot|Slackbot-LinkExpanding|Discordbot|SkypeUriPreview|Pinterestbot") {
        return 418;
    }
    add_header Cache-Control "no-store" always;
    add_header Vary "User-Agent" always;
    try_files /index.html =404;
}

location = /index.html {
    error_page 418 = @token_share_preview;
    if ($http_user_agent ~* "TelegramBot|facebookexternalhit|Facebot|Twitterbot|WhatsApp|LinkedInBot|Slackbot-LinkExpanding|Discordbot|SkypeUriPreview|Pinterestbot") {
        return 418;
    }
    add_header Cache-Control "no-store" always;
    add_header Vary "User-Agent" always;
    try_files $uri =404;
}

# 仅用户站静态文件；排除 API 和同域管理端，避免素材接口或管理端资源被此规则接管。
# 缺失 JS/CSS/图片等无论什么 User-Agent 都返回404，不生成预览HTML冒充资源。
location ~* ^/(?!api(?:/|$)|token(?:/|$)).*\.(?:js|mjs|css|map|json|webmanifest|wasm|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|pdf|bcmap|pfb|bin|txt|xml|html?)$ {
    try_files $uri =404;
}

location / {
    error_page 418 = @token_share_preview;
    if ($http_user_agent ~* "TelegramBot|facebookexternalhit|Facebot|Twitterbot|WhatsApp|LinkedInBot|Slackbot-LinkExpanding|Discordbot|SkypeUriPreview|Pinterestbot") {
        return 418;
    }
    add_header Cache-Control "no-store" always;
    add_header Vary "User-Agent" always;
    try_files $uri $uri/ /index.html;
}

location @token_share_preview {
    # 清空内部API query，原始用户网址（含原编码query）只通过可信代理头传递。
    rewrite ^ /api/compute/public/share? break;
    proxy_pass http://127.0.0.1:9091;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Token-Share-Target $request_uri;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_cache off;
    proxy_intercept_errors off;
}
