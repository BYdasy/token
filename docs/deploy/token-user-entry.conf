# 用户站 server 内使用；替换旧 location /，不要再 include token-share-preview.conf。
# 保留原来的 root、证书、/api/、/token/ 和静态资源 location，不在管理站套用。
location / {
    error_page 418 = @token_share_preview;
    if ($http_user_agent ~* "TelegramBot|facebookexternalhit|Twitterbot|WhatsApp") {
        return 418;
    }
    try_files $uri $uri/ /index.html;
}

# $request_uri 保留最初用户链接的路径和参数；清除 API 的 query，避免参数混用。
location @token_share_preview {
    rewrite ^ /api/compute/public/share? break;
    proxy_pass http://127.0.0.1:9091;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Token-Share-Target $request_uri;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_cache off;
}
