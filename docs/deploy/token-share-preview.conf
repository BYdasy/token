# 放在用户站server块内，配合原location /里的三行爬虫规则（见本轮部署说明）。
# rewrite使用break且proxy_pass不带URI，符合Nginx命名location规则。
location @token_share_preview {
    rewrite ^ /api/compute/public/share? break;
    proxy_pass http://127.0.0.1:9091;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Token-Share-Target $request_uri;
    proxy_set_header CF-Connecting-IP "";
    proxy_cache off;
}
