# 放在各个Token站点的server块内；可以保存为公共片段后通过include复用。
# 保持/api原路径，兼容业务接口、素材、SSE和MCAG签名回调。
location /api/ {
    proxy_pass http://127.0.0.1:9091;
    proxy_http_version 1.1;

    # 保留域名及非默认端口，HTTPS在本层终止后仍能判断浏览器真实同源。
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    # 本机Nginx是Java的直接可信代理；真实地址由server级Cloudflare real_ip片段恢复。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Token-Share-Target "";

    # 通知SSE持续返回，避免被代理缓冲或缓存。
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}
